# Dial pushes are layer keys, the same on every layer: previous / layer 1 / next.

[enc.1.push]
kind = "layer-dec"

[enc.2.push]
kind = "layer-set"
layer = 1

[enc.3.push]
kind = "layer-inc"

# Dial turns: relative CC 16..18 on every layer.

[enc.1.turn]
kind = "cc-relative"
cc = 16

[enc.2.turn]
kind = "cc-relative"
cc = 17

[enc.3.turn]
kind = "cc-relative"
cc = 18
