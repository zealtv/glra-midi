# glra-osc default profile: the file to copy and edit (the app writes the same format).
# Design: docs/config-app.md section 2.
#
# Control names are PHYSICAL and never change with the pad's orientation:
#   key.1 .. key.16, enc.1.push .. enc.3.push, enc.1.turn .. enc.3.turn
# (key 1 is top-left with the dials along the top). Leave a control out to do nothing.
#
# A control holds exactly ONE of these (mixing them is an error):
#   [key.1]            kind = ... directly: the same event on every layer ("global"),
#                      or a layer key (layer-set / layer-inc / layer-dec, global by construction)
#   [key.1.layers.2]   a table per layer, 1..count: different events per layer; a layer
#                      without a table does nothing. No fall-through to a global event.
#
# Every event takes an optional channel = 1..16 (default: [midi] channel). Fields, with defaults:
#   Presses (keys and dial pushes):
#     kind = "note"          note 0..127, velocity 1..127 (127), mode "momentary"|"latch" ("momentary")
#     kind = "cc-momentary"  cc, low (0), high (127), ease-ms 0..10000 (0), curve (linear),
#                            mode "momentary"|"latch" ("momentary")
#     kind = "cc-set"        cc, value 0..127
#     kind = "cc-step"       cc, step -127..127 but not 0 (negative = dec), ease-ms (0), curve (linear)
#     kind = "layer-set"     layer 1..count        (global; goes to that layer)
#     kind = "layer-inc"     (global; next layer, wraps)
#     kind = "layer-dec"     (global; previous layer, wraps)
#   Dial turns (enc.N.turn; a turn takes the global or per-layer shape, never a layer key):
#     kind = "cc-relative"   cc, encoding "twos-complement" (default) | "binary-offset" | "signed-bit"
#     kind = "cc-absolute"   cc, step 1..127 (1), initial 0..127 (optional: the start value
#                            of that channel+cc; two dials may not give different ones)
#   curve = "linear" | "ease-in" | "ease-out" | "ease-in-out"; ease-ms = 0 jumps.
#
# Optional sections (their defaults shown):
#   [pad]      orientation = "dials-top"   # | dials-right | dials-bottom | dials-left
#   [lighting] mode = 0..12, brightness = 0..4 (4), speed = 0..4 (2),
#              color = [hue, sat, value] (0..255, only for modes that take one colour)
#              Without [lighting] the app leaves the pad's lighting alone. Every lighting
#              write is saved in the pad's memory, so only the app's Apply button sends it.
#
# Saving from the app rewrites this file in a fixed order and drops the comments.

version = 1

[midi]
port = "GLRA K16"
channel = 1            # 1..16

[pad]
orientation = "dials-top"

[layers]
count = 4              # 1..8
# names = ["Drums", "Synth", "", "Mixer"]   # optional; "" is unnamed

# Keys: notes 36..51 on layer 1, 52..67 on layer 2, 68..83 on layer 3, 84..99 on layer 4.

[key.1.layers.1]
kind = "note"
note = 36

