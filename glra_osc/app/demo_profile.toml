# Fixture for `glra-osc config --demo` and the captures: the docs/config-app.md 2.5 example.
version = 1

[midi]
port = "GLRA K16"
channel = 1

[pad]
orientation = "dials-top"

[layers]
count = 4
names = ["Drums", "Synth", "", "Mixer"]

[lighting]
mode = 2
brightness = 4
speed = 2
color = [0, 255, 255]

# A global note: the same on every layer.
[key.1]
kind = "note"
note = 36
velocity = 110

# Per-layer: a latched note on layer 1, a CC glide on layer 2, nothing on 3 and 4.
[key.2.layers.1]
kind = "note"
note = 37
mode = "latch"

[key.2.layers.2]
kind = "cc-momentary"
cc = 20
low = 10
high = 120
rise-ms = 250
fall-ms = 600
curve = "ease-out"
channel = 2

# CC set and CC step.
[key.3]
kind = "cc-set"
cc = 21
value = 64

[key.4.layers.1]
kind = "cc-step"
cc = 21
step = 8
ease-ms = 120
curve = "ease-in-out"

[key.8.layers.1]
kind = "cc-step"
cc = 21
step = -8
ease-ms = 120
curve = "ease-in-out"

[key.5.layers.1]
kind = "note"
note = 38

[key.6.layers.1]
kind = "note"
note = 39
channel = 10

# Layer keys: global by construction.
[key.13]
kind = "layer-set"
layer = 1

[enc.1.push]
kind = "layer-dec"

[enc.3.push]
kind = "layer-inc"

[enc.2.push.layers.1]
kind = "cc-set"
cc = 22
value = 0

# Dial turns: global relative, per-layer absolute sharing cc 21 with keys 3, 4, 8.
[enc.1.turn]
kind = "cc-relative"
cc = 16

[enc.2.turn.layers.1]
kind = "cc-absolute"
cc = 21
step = 2
initial = 64

[enc.2.turn.layers.2]
kind = "cc-relative"
cc = 17
encoding = "binary-offset"
