# glra-osc default mapping: the file to copy and edit.
#
# Controls: key.1..key.16, enc.1..enc.3 (push + turn). Leave a control out to leave it unmapped.
#
# A push/key binding is either a note or a cc:
#   note = 0..127, velocity = 1..127 (default 127), mode = "momentary" | "toggle"
#   cc   = 0..127, on = 0..127 (default 127), off = 0..127 (default 0), mode = ...
#
# An encoder turn is relative or absolute:
#   type = "relative", cc = 0..127,
#       encoding = "twos-complement" (default) | "binary-offset" (64 +/- n) | "signed-bit"
#   type = "absolute", cc = 0..127, initial = 0..127 (default 64), step = 1..127 (default 1);
#       the value clamps to 0..127

[global]
port = "GLRA K16"
channel = 1            # 1..16

[key.1]
note = 36
velocity = 127
mode = "momentary"

[key.2]
note = 37
velocity = 127
mode = "momentary"

[key.3]
note = 38
velocity = 127
mode = "momentary"

