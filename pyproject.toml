[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "glra-midi"
dynamic = ["version"]
description = "Host-side middleware that turns the G-LRA K16_N3 macropad into a silent MIDI controller"
readme = "README.md"
requires-python = ">=3.13"
license = "GPL-3.0-only"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
dependencies = ["hidapi==0.15.0", "rtmidi2>=1.5.0", "tomli-w==1.2.0"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
dev = ["ruff==0.12.12"]
gui = ["PySide6==6.10.2"]

[project.scripts]
glra-midi = "glra_midi.cli:main"
glra-midi-config = "glra_midi.app:main"

[tool.setuptools.dynamic]
version = { attr = "glra_midi.__version__" }

[tool.setuptools.packages.find]
include = ["glra_midi*"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.setuptools.package-data]
glra_midi = ["*.toml"]
"glra_midi.device" = ["layout.json"]
"glra_midi.app" = ["qml/*.qml", "*.toml"]
