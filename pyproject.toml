[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "glra-osc"
version = "0.0.1"
description = "Host-side middleware that turns the G-LRA K16_N3 macropad into a silent MIDI controller"
readme = "README.md"
requires-python = ">=3.13"
license = "GPL-3.0-only"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
dependencies = ["hidapi==0.15.0", "rtmidi2>=1.5.0"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
dev = ["ruff==0.12.12"]

[project.scripts]
glra-osc = "glra_osc.cli:main"

[tool.setuptools.packages.find]
include = ["glra_osc*"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.setuptools.package-data]
glra_osc = ["*.toml"]
