[enc.2.turn.layers.3]
kind = "cc-relative"
cc = 17
channel = 3

# Right: one absolute CC 18 on channel 1, global (the same on every layer), starting at 64.

[enc.3.turn]
kind = "cc-absolute"
cc = 18
channel = 1
initial = 64
